name: Web CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: Web/package-lock.json

    - name: Install dependencies
      working-directory: ./Web
      run: npm install

    - name: Run linter
      working-directory: ./Web
      run: npm run lint

    - name: Run unit tests
      working-directory: ./Web
      run: npm test

    - name: Build Web app
      working-directory: ./Web
      run: npm run build
