name: Android Release APK

# F8.2: builds the release APK when a tag like v1.2.0 is pushed (or manually).
# Signing: add repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Without them an unsigned APK is produced.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Pull LFS objects (only the Android assets)
        run: git lfs pull --include="Android/app/src/main/assets/**"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DICTALEARN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build release
        working-directory: ./Android
        env:
          DICTALEARN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DICTALEARN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DICTALEARN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # one APK per CPU architecture (arm64 phones need app-arm64-v8a-release.apk)
        run: ./gradlew testDebugUnitTest assembleRelease -Pdictalearn.abiSplits=true --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dictalearn-release-apk
          path: Android/app/build/outputs/apk/release/*.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Android/app/build/outputs/apk/release/*.apk
